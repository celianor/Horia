<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نداهای روشن‌کننده | کتاب روشنی‌ها</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #c19a4b;
      --gold-light: #e2c77f;
      --gold-dark: #806021;

      --ink: #34291b;
      --ink-light: #65533a;

      --paper: #f8f0dc;
      --paper-light: #fffaf0;

      --night: #151009;
      --night-2: #2a2115;

      --line: rgba(193, 154, 75, .45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Vazirmatn", Tahoma, sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(224, 199, 127, .17),
          transparent 35rem
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(193, 154, 75, .08),
          transparent 25rem
        ),
        linear-gradient(
          135deg,
          #0e0b07,
          #21180d 50%,
          #0e0b07
        );

      padding: 30px 0;
      color: var(--ink);
    }

    /* =========================
       قاب اصلی کتاب
       ========================= */

    .book {
      width: min(1050px, calc(100% - 20px));
      margin: auto;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(193, 154, 75, .07),
          transparent 25rem
        ),
        linear-gradient(
          180deg,
          var(--paper-light),
          var(--paper)
        );

      box-shadow:
        0 30px 80px rgba(0, 0, 0, .60),
        0 5px 25px rgba(0, 0, 0, .35);
    }

    /* قاب طلایی بیرونی */

    .book::
