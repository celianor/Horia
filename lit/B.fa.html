  <style>

    /* =========================================================
       متغیرهای اصلی
       ========================================================= */

    :root {

      --deep-1: #050619;
      --deep-2: #0a0d29;
      --deep-3: #17143d;
      --deep-4: #282052;

      --purple: #7668c9;
      --purple-light: #bdb4ef;

      --gold: #dfbf61;
      --gold-light: #fff1b5;

      --cream: #fffdf7;
      --paper: #f8f5ef;

      --text: #443b4e;
      --muted: #776d81;

      --border:
        rgba(223,191,97,.25);

      --shadow:
        0 30px 90px
        rgba(3,5,25,.30);

    }


    /* =========================================================
       پایه
       ========================================================= */

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        "Vazirmatn",
        Tahoma,
        sans-serif;

      color:
        var(--text);

      line-height:
        2;

      background:

        radial-gradient(
          circle at 50% -10%,
          rgba(118,104,201,.42),
          transparent 31%
        ),

        radial-gradient(
          circle at 12% 35%,
          rgba(223,191,97,.10),
          transparent 25%
        ),

        radial-gradient(
          circle at 88% 50%,
          rgba(189,180,239,.10),
          transparent 25%
        ),

        linear-gradient(
          180deg,
          var(--deep-1) 0%,
          var(--deep-2) 30%,
          var(--deep-3) 58%,
          var(--deep-4) 74%,
          #ebe6f0 100%
        );

      overflow-x:
        hidden;

    }


    /* =========================================================
       آسمان پس‌زمینه
       ========================================================= */

    .cosmos {

      position: fixed;

      inset: 0;

      z-index: -10;

      pointer-events: none;

      overflow: hidden;

    }


    .stars {

      position: absolute;

      inset: -20%;

      opacity: .48;

      background-image:

        radial-gradient(
          circle,
          rgba(255,255,255,.95) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(223,191,97,.75) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle,
          rgba(255,255,255,.55) 0 1px,
          transparent 1.5px
        );

      background-size:
        137px 151px,
        211px 197px,
        89px 113px;

      background-position:
        12px 25px,
        51px 71px,
        7px 48px;

      animation:
        starMove 45s linear infinite;

    }

      from {
        transform:
          translate3d(0,0,0);
      }

          translate3d
